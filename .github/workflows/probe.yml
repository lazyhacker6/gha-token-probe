name: token probe 2
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: git data api workflow
        env:
          TOK: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.error
          tok = os.environ["TOK"]; R = os.environ["R"]
          def call(method, path, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request("https://api.github.com" + path, data=data, method=method)
              req.add_header("Authorization", "Bearer " + tok)
              req.add_header("Accept", "application/vnd.github+json")
              if data is not None: req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as r: return r.status, r.read().decode()
              except urllib.error.HTTPError as e: return e.code, e.read().decode()[:300]
          st, b = call("GET", "/repos/%s/git/ref/heads/main" % R)
          print("REF", st, b[:120])
          base = json.loads(b)["object"]["sha"]
          st, b = call("POST", "/repos/%s/git/blobs" % R, {"content": "name: bypass\non: push\njobs: {x: {runs-on: ubuntu-latest, steps: [{run: echo hi}]}}\n", "encoding": "utf-8"})
          print("BLOB", st, b[:120]); blob = json.loads(b)["sha"]
          st, b = call("POST", "/repos/%s/git/trees" % R, {"base_tree": base, "tree": [{"path": ".github/workflows/bypass.yml", "mode": "100644", "type": "blob", "sha": blob}]})
          print("TREE", st, b[:120]); tree = json.loads(b)["sha"]
          st, b = call("POST", "/repos/%s/git/commits" % R, {"message": "bypass test", "tree": tree, "parents": [base]})
          print("COMMIT", st, b[:120]); commit = json.loads(b)["sha"]
          st, b = call("POST", "/repos/%s/git/refs" % R, {"ref": "refs/heads/bypass-branch", "sha": commit})
          print("NEWREF", st, b[:200])
          st, b = call("PATCH", "/repos/%s/git/refs/heads/main" % R, {"sha": commit, "force": True})
          print("UPDREF", st, b[:200])
          PY
